name = "mynews"
main = "worker/index.ts"
compatibility_date = "2026-10-16"
workers_dev = true

[assets]
directory = "./dist"
binding = "ASSETS"
run_worker_first = false

[[d1_databases]]
binding = "DB"
database_name = "mynews-db"
database_id = "f7a7e839-cb84-4c97-b27d-eb430de2342b"
migrations_dir = "migrations"

[vars]
DAILY_CREDIT_CAP = "160"
SESSION_TTL_HOURS = "168"
# Set APP_ORIGIN after deployment, e.g. https://mynews.your-subdomain.workers.dev
# Keep NEWSDATA_API_KEY and BOOTSTRAP_TOKEN as encrypted Worker secrets.
